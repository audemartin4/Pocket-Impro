<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Pocket Impro — l'assistant des improvisateurs</title>
    <meta name="description" content="Génère un cours d'impro, un spectacle ou un échauffement en quelques secondes. 389 exercices, 127 catégories, gratuit." />

    <!-- Bleu nuit de l'appli : la barre du navigateur prolonge l'en-tête au lieu de rester grise. -->
    <meta name="theme-color" content="#1E2A38" />

    <!-- Icônes. Le PNG 48 sert de favicon moderne, le 32 et le 16 restent pour les vieux
         navigateurs ; `apple-touch-icon` est carré, iOS arrondit lui-même. -->
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Ce qui s'affiche quand on envoie le lien sur Messenger, WhatsApp ou Facebook. Sans ces
         lignes, le lien partait tout nu : une URL, sans titre, sans phrase, sans image. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.pocketimpro.com/" />
    <meta property="og:site_name" content="Pocket Impro" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:title" content="Pocket Impro — l'assistant des improvisateurs" />
    <meta property="og:description" content="Génère un cours d'impro, un spectacle ou un échauffement en quelques secondes. 389 exercices, 127 catégories, gratuit." />
    <meta property="og:image" content="https://www.pocketimpro.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Pocket Impro — l'assistant des improvisateurs" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
